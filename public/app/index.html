<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin"><!-- map tiles need the site origin as Referer (OSM tile policy) -->
<title>Kinkoverse</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Telegram's Mini App script, self-hosted: telegram.org is blocked in Russia and the web view does not go through
     Telegram's proxy (vendor/telegram/SOURCE.txt). The only outside requests are the map tiles (OpenStreetMap). -->
<script src="vendor/telegram/telegram-web-app.js?v=8.0.2"></script>
<script>
/* owner, 2026-11-01: the texts of ONE language, asked for at once — in parallel with app.js (which uses this request).
   Same language rule as app.js; the person's own choice from the settings comes later with /api/me. */
(function () { try {
  var w = window.Telegram && window.Telegram.WebApp, u = w && w.initDataUnsafe && w.initDataUnsafe.user;
  var l = /^(ru|uk|be|kk)/.test((u && u.language_code) || navigator.language || "") ? "ru" : "en";
  var url = { ru: "i18n/ru.json?v=8", en: "i18n/en.json?v=8" }[l];
  window.KV_TEXTS = { lang: l, p: fetch(url).then(function (r) { if (!r.ok) throw new Error(url + " " + r.status); return r.json(); }) };
  window.KV_TEXTS.p.catch(function () { /* app.js asks once more */ });
} catch (e) { /* app.js asks itself */ } })();
</script>
<link rel="stylesheet" href="app.css?v=58">
</head>
<body>
<!-- owner, 2026-10-27: the gold of «Звезда комьюнити», shared by every star on the page -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="kvgold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".45" stop-color="#ffc61a"/><stop offset="1" stop-color="#d48f00"/></linearGradient></defs></svg>
<main id="app" aria-live="polite"><div class="center muted">…</div></main>
<!-- owner, 2026-10-31: the contact check for «да» messages (the server runs the same file) -->
<script src="contacts.js?v=1"></script>
<script src="app.js?v=99"></script>
</body>
</html>
